# Background-removal Lambda (lambda/rembg/): build the image, push it to ECR,
# point the function at it. Runs when its files change on main, or by hand.
#
# One-time AWS setup (README, "배경 제거 Lambda"): ECR repository and Lambda
# function both named lovablepet-rembg. Secrets AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY: an IAM user allowed to push to that repository and
# update that function. Before the function exists a run only pushes the image.
name: rembg Lambda

on:
  push:
    branches: [main]
    paths: ['lambda/rembg/**', 'api/bria.py']
  workflow_dispatch:

concurrency:
  group: rembg-lambda
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  REPOSITORY: lovablepet-rembg
  FUNCTION: lovablepet-rembg

jobs:
  deploy:
    name: Build, push, update function
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: lambda/rembg/Dockerfile
          platforms: linux/amd64
          provenance: false        # Lambda refuses image indexes that carry attestations
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=rembg
          cache-to: type=gha,mode=max,scope=rembg

      - name: Point the function at the new image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/$REPOSITORY:${{ github.sha }}"
          if aws lambda get-function --function-name "$FUNCTION" >/dev/null 2>&1; then
            aws lambda update-function-code --function-name "$FUNCTION" --image-uri "$IMAGE" >/dev/null
            aws lambda wait function-updated --function-name "$FUNCTION"
            echo "updated $FUNCTION -> $IMAGE"
          else
            echo "::notice::No function $FUNCTION yet. Create it from $IMAGE (README); later runs update it."
          fi
